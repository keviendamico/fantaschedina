services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - /mnt/HC_Volume_106591043:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantaschedina -d fantaschedina"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080"
