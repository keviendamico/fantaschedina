spring.application.name=fantatotocalcio

# DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/fantaschedina
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/dev

# App
app.base-url=http://localhost:8080
app.mail.from=noreply@fantatotocalcio.dev
app.reminder.minutes-before-deadline=60

# Mail
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Quartz
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.properties.org.quartz.scheduler.instanceName=FantaTotocalcioScheduler
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.threadPool.threadCount=5
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate

# Thymeleaf
spring.thymeleaf.cache=false

# Logging
logging.level.com.fantacalcio.fantaschedina=DEBUG
logging.level.org.quartz.core=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %clr(%5p) [%X{reqId:--}] %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx
