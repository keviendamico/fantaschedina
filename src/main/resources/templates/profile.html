<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FantaTotocalcio - Profilo</title>
    <div th:replace="~{fragments/head-assets :: assets}"></div>
</head>
<body class="ft-page">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4" style="max-width: 560px;">

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <h4 class="mb-4 ft-brand-title">Il mio profilo</h4>

    <div class="ft-ticket mb-4">
        <div class="ft-ticket-header">
            <span>Dati account</span>
        </div>
        <div class="p-3">
            <dl class="row mb-0">
                <dt class="col-4 text-muted">Username</dt>
                <dd class="col-8" th:text="${profileUser.username}"></dd>
                <dt class="col-4 text-muted">Email</dt>
                <dd class="col-8" th:text="${profileUser.email}"></dd>
            </dl>
            <p class="text-muted small mb-0">Per cambiare l'email contatta un admin.</p>
        </div>
    </div>

    <div class="ft-ticket">
        <div class="ft-ticket-header">
            <span>Notifiche email</span>
        </div>
        <div class="p-3">
            <form method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" role="switch"
                           id="notificationsEnabled" name="notificationsEnabled" value="true"
                           th:checked="${profileUser.notificationsEnabled}">
                    <label class="form-check-label" for="notificationsEnabled">
                        Ricevi promemoria schedina, avvisi di auto-invio e notifiche risultati
                    </label>
                </div>
                <p class="text-muted small">Gli inviti e le email di reset password vengono sempre inviati, indipendentemente da questa impostazione.</p>
                <button type="submit" class="btn btn-ft-green">Salva</button>
            </form>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
