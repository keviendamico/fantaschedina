<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FantaTotocalcio - Reimposta password</title>
    <div th:replace="~{fragments/head-assets :: assets}"></div>
</head>
<body class="ft-page">

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-sm-8 col-md-6 col-lg-4">

            <div class="text-center mb-4">
                <img th:src="@{/images/logo.png}" alt="FantaTotocalcio" style="max-width: 280px; width:100%;">
                <p class="text-muted mt-2">Scegli una nuova password</p>
            </div>

            <div class="ft-ticket">
                <div class="ft-ticket-header">
                    <span>Nuova password</span>
                </div>
                <div class="p-4">

                    <form th:action="@{/reset-password}" th:object="${resetPasswordRequest}" method="post">
                        <input type="hidden" name="token" th:value="${token}">

                        <div class="mb-3">
                            <label for="password" class="form-label">Nuova password</label>
                            <input type="password" class="form-control" id="password"
                                   th:field="*{password}" autocomplete="new-password" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('password')}"
                                 th:errors="*{password}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Conferma password</label>
                            <input type="password" class="form-control" id="confirmPassword"
                                   th:field="*{confirmPassword}" autocomplete="new-password" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}"
                                 th:errors="*{confirmPassword}"></div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-ft-green">Reimposta password</button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
