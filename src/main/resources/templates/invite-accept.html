<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FantaTotocalcio — Accetta invito</title>
    <div th:replace="~{fragments/head-assets :: assets}"></div>
</head>
<body class="ft-page">

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-sm-8 col-md-6 col-lg-4">

            <div class="text-center mb-4">
                <img th:src="@{/images/logo.png}" alt="FantaTotocalcio" style="max-width: 280px; width:100%;">
                <p class="text-muted mt-2">Sei stato invitato a unirti a una lega!</p>
            </div>

            <div class="ft-ticket">
                <div class="ft-ticket-header">
                    <span>Nuovo FantaTeam</span>
                </div>
                <div class="p-4">
                    <h6 class="mb-3 text-muted">Scegli il nome del tuo team</h6>

                    <form th:action="@{/invite/accept}" method="post">
                        <input type="hidden" name="token" th:value="${token}">
                        <div class="mb-3">
                            <label for="fantaTeamName" class="form-label">Nome FantaTeam</label>
                            <input type="text" class="form-control" id="fantaTeamName"
                                   name="fantaTeamName" minlength="2" maxlength="100" required autofocus>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-ft-green">Entra nella lega</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
