<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FantaTotocalcio - Modifica utente</title>
    <div th:replace="~{fragments/head-assets :: assets}"></div>
</head>
<body>

<div th:replace="~{admin/fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="d-flex align-items-center gap-2 mb-3">
                <a th:href="@{/admin/leagues/{id}/members(id=${league.id})}" class="btn btn-outline-secondary btn-sm">← Componenti</a>
                <h4 class="mb-0 ft-brand-title" th:text="'Modifica ' + ${targetUser.username}"></h4>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/admin/leagues/{leagueId}/members/{membershipId}/edit-user(leagueId=${league.id},membershipId=${membershipId})}"
                          method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" th:value="${targetUser.username}" disabled>
                            <div class="form-text">Lo username non è modificabile.</div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email"
                                   th:value="${targetUser.email}" required>
                        </div>

                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" role="switch"
                                   id="notificationsEnabled" name="notificationsEnabled" value="true"
                                   th:checked="${targetUser.notificationsEnabled}">
                            <label class="form-check-label" for="notificationsEnabled">
                                Ricevi promemoria, avvisi di auto-invio e notifiche risultati
                            </label>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-ft-green">Salva</button>
                            <a th:href="@{/admin/leagues/{id}/members(id=${league.id})}" class="btn btn-outline-secondary">Annulla</a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
