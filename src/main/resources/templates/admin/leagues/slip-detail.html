<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Schedina - Giornata ' + ${matchday.number}">FantaTotocalcio Admin</title>
    <div th:replace="~{fragments/head-assets :: assets}"></div>
</head>
<body>

<div th:replace="~{admin/fragments/navbar :: navbar}"></div>

<div class="container mt-4" style="max-width: 680px;">

    <div class="mb-4">
        <a th:href="@{/admin/leagues/{lid}/matchdays/{mid}/slips(lid=${league.id},mid=${matchday.id})}"
           class="text-muted small">← Schedine giornata <span th:text="${matchday.number}"></span></a>
        <h4 class="mb-0 mt-1 ft-brand-title">Dettaglio schedina</h4>
        <span class="text-muted" th:text="${league.name}"></span>
    </div>

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
            <div class="fw-semibold" th:text="${teamName}"></div>
            <div class="text-muted small"
                 th:if="${slip.submittedAt != null}"
                 th:text="'Inviata il ' + ${#temporals.format(slip.submittedAt, 'dd/MM/yyyy HH:mm')}"></div>
        </div>
        <div class="text-end">
            <span class="badge fs-6"
                  th:classappend="${slip.status.name() == 'WON'} ? 'bg-success' :
                                  (${slip.status.name() == 'LOST'} ? 'bg-danger' :
                                  (${slip.status.name() == 'VOID'} ? 'bg-secondary' : 'bg-primary'))"
                  th:text="${slip.status.label}"></span>
            <div class="mt-1">
                <span th:if="${slip.isAutoSubmitted}" class="badge bg-warning text-dark">Auto-inviata</span>
                <span th:if="${slip.isAdminModified}" class="badge bg-info text-dark">Modificata</span>
            </div>
        </div>
    </div>

    <!-- Tabella pick -->
    <div class="table-responsive">
        <table class="table table-bordered align-middle mb-0 ft-table-striped">
            <thead class="table-light">
                <tr>
                    <th>Partita</th>
                    <th class="text-center">Tipo</th>
                    <th class="text-center">Esito</th>
                    <th th:if="${slip.status.name() != 'PENDING'}" class="text-center" style="width: 60px;"></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="fixture : ${fixtures}"
                    th:with="pick=${picksByFixture[fixture.id]}">
                    <td>
                        <span th:text="${teamNames[fixture.homeFantaTeamId]}"></span>
                        <span class="text-muted mx-1">vs</span>
                        <span th:text="${teamNames[fixture.awayFantaTeamId]}"></span>
                        <div th:if="${fixture.resultLoaded}" class="text-muted small">
                            <span th:text="${fixture.homeScore} + ' - ' + ${fixture.awayScore}"></span>
                        </div>
                    </td>
                    <td class="text-center text-muted small" th:text="${pick?.outcomeType?.label}"></td>
                    <td class="text-center">
                        <span th:if="${pick != null}" class="badge fs-6"
                              th:classappend="${pick.isCorrect == null}  ? 'bg-warning text-dark' :
                                              (${pick.isCorrect == true} ? 'bg-success' : 'bg-danger')"
                              th:text="${pick.pickedOutcome}">
                        </span>
                        <span th:unless="${pick != null}" class="text-muted">-</span>
                    </td>
                    <td th:if="${slip.status.name() != 'PENDING'}" class="text-center">
                        <span th:if="${pick?.isCorrect == true}"  class="text-success fw-bold">✓</span>
                        <span th:if="${pick?.isCorrect == false}" class="text-danger fw-bold">✗</span>
                        <span th:if="${pick == null or pick.isCorrect == null}" class="text-muted">-</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-3 d-flex gap-2">
        <a th:href="@{/admin/leagues/{lid}/matchdays/{mid}/slips(lid=${league.id},mid=${matchday.id})}"
           class="btn btn-outline-secondary btn-sm">← Torna alle schedine</a>
        <a th:if="${matchday.status.name() == 'OPEN'}"
           th:href="@{/admin/leagues/{lid}/slips/{sid}/edit(lid=${league.id},sid=${slip.id})}"
           class="btn btn-outline-primary btn-sm">Modifica</a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
