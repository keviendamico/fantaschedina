<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FantaTotocalcio - Dashboard</title>
    <div th:replace="~{fragments/head-assets :: assets}"></div>
</head>
<body class="ft-page">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <h4 class="mb-4 ft-brand-title">Le mie leghe</h4>

    <div th:if="${#lists.isEmpty(leagueCards)}" class="alert alert-info">
        Non sei ancora iscritto a nessuna lega. Attendi un invito dall'amministratore.
    </div>

    <div class="row g-3">
        <div class="col-md-6" th:each="card : ${leagueCards}">
            <div class="ft-ticket h-100">
                <div class="ft-ticket-header">
                    <span th:text="${card.league.name}"></span>
                    <span class="small fw-normal" th:text="${card.league.season}"></span>
                </div>
                <div class="p-3">

                    <!-- Giornata corrente -->
                    <div th:if="${card.currentMatchday != null}" class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <span class="small text-muted text-uppercase fw-semibold">Giornata corrente</span>
                            <span class="badge"
                                  th:text="${card.currentMatchday.status.label}"
                                  th:classappend="${card.currentMatchday.status.name() == 'OPEN'} ? 'badge-ft-green' :
                                                  (${card.currentMatchday.status.name() == 'CLOSED'} ? 'badge-ft-orange' :
                                                  (${card.currentMatchday.status.name() == 'AWAITING_RECOVERY'} ? 'bg-danger' :
                                                  'bg-secondary'))">
                            </span>
                        </div>
                        <div class="fw-semibold" th:text="'Giornata ' + ${card.currentMatchday.number}"></div>

                        <!-- Deadline -->
                        <div th:if="${card.effectiveDeadline != null}" class="text-muted small mt-1">
                            <span th:if="${!card.deadlinePassed()}">
                                Scadenza: <strong th:text="${#temporals.format(card.effectiveDeadline, 'dd/MM HH:mm')}"></strong>
                                - <span class="countdown fw-bold text-success"
                                        th:data-deadline="${#temporals.format(card.effectiveDeadline, 'yyyy-MM-dd''T''HH:mm:ss')}"></span>
                            </span>
                            <span th:if="${card.deadlinePassed()}" class="text-danger">Deadline scaduta</span>
                        </div>
                    </div>
                    <div th:if="${card.currentMatchday == null}" class="text-muted small fst-italic mb-3">
                        Nessuna giornata attiva
                    </div>

                    <!-- Stato schedina -->
                    <div th:if="${card.isMatchdayOpen()}" class="mb-3">
                        <span class="small text-muted text-uppercase fw-semibold">Schedina</span>
                        <div class="mt-1">
                            <span th:if="${card.currentSlip != null}"
                                  class="badge badge-ft-green">Inviata</span>
                            <span th:if="${card.currentSlip == null and !card.deadlinePassed()}"
                                  class="badge bg-warning text-dark">Da giocare</span>
                            <span th:if="${card.currentSlip == null and card.deadlinePassed()}"
                                  class="badge bg-secondary">Non giocata</span>
                        </div>
                    </div>

                    <!-- Crediti e Jackpot -->
                    <div class="d-flex gap-4 mt-2">
                        <div>
                            <div class="small text-muted text-uppercase fw-semibold">Crediti</div>
                            <div class="fw-bold" th:text="${card.membership.balance} + ' cr'"></div>
                        </div>
                        <div th:if="${card.jackpot != null}">
                            <div class="small text-muted text-uppercase fw-semibold">Jackpot</div>
                            <div class="fw-bold" style="color: var(--ft-pink-dark);" th:text="${card.jackpot} + ' cr'"></div>
                        </div>
                    </div>

                </div>
                <div class="ft-perforation"></div>
                <div class="p-3 d-flex flex-column gap-2">
                    <a th:if="${card.canPlay()}"
                       th:href="@{/leagues/{lid}/matchdays/{mid}/bet(lid=${card.league.id},mid=${card.currentMatchday.id})}"
                       class="btn btn-ft-green py-2">Gioca ora</a>
                    <div class="d-flex gap-2">
                        <a th:href="@{/leagues/{id}/matchdays(id=${card.league.id})}"
                           class="btn btn-ft-outline-green btn-sm flex-fill">Giornate</a>
                        <a th:href="@{/leagues/{id}/history(id=${card.league.id})}"
                           class="btn btn-ft-outline-green btn-sm flex-fill">Storico</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('.countdown').forEach(el => {
        const deadline = new Date(el.dataset.deadline).getTime();
        function update() {
            const diff = deadline - Date.now();
            if (diff <= 0) { el.textContent = ''; return; }
            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            el.textContent = `(${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s)`;
        }
        update();
        setInterval(update, 1000);
    });
</script>
</body>
</html>
