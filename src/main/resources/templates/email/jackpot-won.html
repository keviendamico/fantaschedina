<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0; padding:0; background-color:#f4e9cf; font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4e9cf; padding:32px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="480" cellpadding="0" cellspacing="0"
                   style="background-color:#fffdf8; border-radius:18px; overflow:hidden; max-width:480px; width:100%;">
                <tr th:replace="~{email/fragments :: header('Signori, abbiamo un vincitore!')}"></tr>
                <tr>
                    <td style="padding:8px 32px 32px; color:#23301f; font-size:15px; line-height:1.6;">
                        <p>Ciao <strong th:text="${username}">utente</strong>!</p>
                        <p>Il jackpot della giornata <strong th:text="${matchdayNumber}">1</strong> di
                            <strong th:text="${leagueName}">Lega</strong> è stato vinto
                            <th:block th:if="${winnerTeamNames.size() == 1}">da:</th:block>
                            <th:block th:unless="${winnerTeamNames.size() == 1}">da queste squadre, che se lo sono diviso:</th:block>
                        </p>
                        <ul style="padding-left:20px; margin:12px 0;">
                            <li th:each="teamName : ${winnerTeamNames}" th:text="${teamName}"
                                style="margin-bottom:4px; font-weight:bold;">Squadra</li>
                        </ul>
                        <p>
                            <th:block th:if="${amountPerWinner == 1}">Ogni vincitore ha ricevuto <strong th:text="${amountPerWinner} + ' credito'">1 credito</strong>.</th:block>
                            <th:block th:unless="${amountPerWinner == 1}">Ogni vincitore ha ricevuto <strong th:text="${amountPerWinner} + ' crediti'">2 crediti</strong>.</th:block>
                        </p>
                        <p style="text-align:center; margin:28px 0;">
                            <a th:replace="~{email/fragments :: cta('Vedi i risultati', ${matchdayLink})}"></a>
                        </p>
                    </td>
                </tr>
                <tr th:replace="~{email/fragments :: footer}"></tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
