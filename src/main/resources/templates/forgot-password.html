<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FantaTotocalcio - Password dimenticata</title>
    <div th:replace="~{fragments/head-assets :: assets}"></div>
</head>
<body class="ft-page">

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-sm-8 col-md-6 col-lg-4">

            <div class="text-center mb-4">
                <img th:src="@{/images/logo.png}" alt="FantaTotocalcio" style="max-width: 280px; width:100%;">
                <p class="text-muted mt-2">Reimposta la tua password</p>
            </div>

            <div class="ft-ticket">
                <div class="ft-ticket-header">
                    <span>Password dimenticata</span>
                </div>
                <div class="p-4">

                    <div th:if="${sent}" class="alert alert-success" role="alert">
                        Se l'indirizzo esiste nel nostro sistema, riceverai a breve un'email con le istruzioni per reimpostare la password.
                    </div>

                    <form th:if="${!sent}" th:action="@{/forgot-password}" th:object="${forgotPasswordRequest}" method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email"
                                   th:field="*{email}" autocomplete="email" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}"></div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-ft-green">Invia link di reset</button>
                        </div>
                    </form>

                </div>
            </div>

            <p class="text-center mt-3 small text-muted">
                <a href="/login" class="ft-link">Torna al login</a>
            </p>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
