<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FantaTotocalcio - Login</title>
    <div th:replace="~{fragments/head-assets :: assets}"></div>
</head>
<body class="ft-page">

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-sm-8 col-md-6 col-lg-4">

            <div class="text-center mb-4">
                <img th:src="@{/images/logo.png}" alt="FantaTotocalcio" style="max-width: 280px; width:100%;">
                <p class="text-muted mt-2">Accedi alla tua lega</p>
            </div>

            <div class="ft-ticket">
                <div class="ft-ticket-header">
                    <span>Login</span>
                </div>
                <div class="p-4">

                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                        Username o password non validi.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success" role="alert">
                        Logout effettuato con successo.
                    </div>
                    <div th:if="${param.resetSuccess}" class="alert alert-success" role="alert">
                        Password reimpostata con successo. Accedi con la nuova password.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username"
                                   autofocus autocomplete="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   autocomplete="current-password" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-ft-green">Accedi</button>
                        </div>
                    </form>

                    <p class="text-center mt-3 small">
                        <a href="/forgot-password" class="ft-link">Password dimenticata?</a>
                    </p>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
